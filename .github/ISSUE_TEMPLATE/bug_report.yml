name: Bug report
description: Report a reproducible problem with the plugin.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: Output of `opencode --version`.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant resolved configuration
      description: Redact credentials before pasting relevant output from `opencode debug config`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Tell us what command you ran, the selected session variant, and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include relevant OpenCode/provider logs with secrets removed.
      render: text
